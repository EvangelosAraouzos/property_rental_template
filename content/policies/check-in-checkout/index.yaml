slug: check-in-checkout
type: check-in
order: 1

title:
  en: "Check-in & Check-out"
  el: "Άφιξη & Αναχώρηση"

content:
  en: |
    **Check-in:** 15:00 – 21:00
    **Check-out:** by 11:00

    Early check-in (from 12:00) and late check-out (until 14:00) are available on request, subject to availability, at no extra charge.

    For arrivals after 21:00 please contact us in advance and we will make alternative arrangements — we will always ensure you can get into your apartment regardless of arrival time.

    A member of the family or a trusted team member will personally meet you at the property to hand over the keys and show you around.
  el: |
    **Άφιξη:** 15:00 – 21:00
    **Αναχώρηση:** έως 11:00

    Πρώιμη άφιξη (από 12:00) και καθυστερημένη αναχώρηση (έως 14:00) είναι διαθέσιμες κατόπιν αιτήματος, ανάλογα με διαθεσιμότητα, χωρίς επιπλέον χρέωση.

    Για αφίξεις μετά τις 21:00, παρακαλούμε επικοινωνήστε μαζί μας εκ των προτέρων και θα κανονίσουμε εναλλακτικά — θα διασφαλίσουμε πάντα ότι μπορείτε να μπείτε στο διαμέρισμά σας ανεξάρτητα από την ώρα άφιξης.

    Ένα μέλος της οικογένειας ή ένα αξιόπιστο μέλος της ομάδας μας θα σας υποδεχθεί προσωπικά στο κτήριο για να σας παραδώσει τα κλειδιά και να σας ξεναγήσει.
