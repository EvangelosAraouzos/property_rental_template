title:
  en: "House Rules"
  el: "Κανόνες Σπιτιού"

content:
  en: |
    We want every guest — including your neighbours — to have a wonderful stay. We ask that you observe a few simple rules.

    **Quiet hours:** 22:00 – 08:00. Please keep noise levels considerate during these hours.

    **Smoking:** Strictly no smoking inside any apartment. Smoking is permitted on balconies and terraces with windows and doors closed. Please use the ashtrays provided and never dispose of cigarette ends over balconies.

    **Parties & events:** Onar Syros is a residential boutique property. We do not permit parties, events or gatherings that disturb other guests or neighbours.

    **Pets:** Pets are welcome in designated apartments — please let us know at the time of booking. A small refundable deposit is required.

    **Additional guests:** Only registered guests may stay overnight. Please let us know in advance if your group size changes.

    **Damage:** Guests are responsible for any damage to the property during their stay. We understand accidents happen and ask only that you let us know promptly.

    **Bins & recycling:** Recycling bins are provided. Please sort waste — it matters on a small island.

    Thank you for helping us keep Onar Syros a place everyone loves.
  el: |
    Θέλουμε κάθε επισκέπτης — συμπεριλαμβανομένων των γειτόνων σας — να έχει μια υπέροχη διαμονή. Σας ζητάμε να τηρείτε μερικούς απλούς κανόνες.

    **Ώρες ησυχίας:** 22:00 – 08:00. Παρακαλούμε διατηρείτε τη στάθμη θορύβου σε χαμηλά επίπεδα κατά τη διάρκεια αυτών των ωρών.

    **Κάπνισμα:** Αυστηρά απαγορεύεται το κάπνισμα εντός οποιουδήποτε διαμερίσματος. Επιτρέπεται το κάπνισμα σε μπαλκόνια και βεράντες με κλειστά παράθυρα και πόρτες.

    **Πάρτι & εκδηλώσεις:** Το Οναρ Σύρος είναι ένα οικιακό μπουτίκ κατάλυμα. Δεν επιτρέπουμε πάρτι, εκδηλώσεις ή συγκεντρώσεις που ενοχλούν άλλους επισκέπτες ή γείτονες.

    **Κατοικίδια:** Τα κατοικίδια είναι ευπρόσδεκτα σε συγκεκριμένα διαμερίσματα — παρακαλούμε ενημερώστε μας κατά την κράτηση. Απαιτείται μικρή επιστρεπτέα εγγύηση.

    **Επιπλέον επισκέπτες:** Μόνο εγγεγραμμένοι επισκέπτες μπορούν να διανυκτερεύουν. Παρακαλούμε ενημερώστε μας εκ των προτέρων εάν αλλάξει το μέγεθος της ομάδας σας.
