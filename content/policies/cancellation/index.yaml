title:
  en: "Cancellation Policy"
  el: "Πολιτική Ακύρωσης"

content:
  en: |
    We understand that plans change. Our cancellation policy is designed to be fair to both guests and hosts.

    **Free cancellation:** Cancel up to **14 days before check-in** for a full refund.

    **Partial refund:** Cancel between **7 and 14 days before check-in** to receive a 50% refund of the total booking value.

    **No refund:** Cancellations made **less than 7 days before check-in** are non-refundable. The full booking amount is charged.

    **No-shows:** If you do not arrive on the scheduled check-in date without prior notice, the full booking amount is charged.

    **Early departures:** If you choose to check out early, no refund will be issued for unused nights.

    **Exceptional circumstances:** In cases of documented medical emergencies or government-imposed travel restrictions, we will work with you to find a fair solution, including date changes or credit towards a future stay.

    To cancel or modify a booking, please contact us as early as possible at stay@onarsyros.com or by phone.
  el: |
    Καταλαβαίνουμε ότι τα σχέδια αλλάζουν. Η πολιτική ακύρωσής μας έχει σχεδιαστεί για να είναι δίκαιη τόσο για τους επισκέπτες όσο και για εμάς.

    **Δωρεάν ακύρωση:** Ακυρώστε έως **14 ημέρες πριν από το check-in** για πλήρη επιστροφή χρημάτων.

    **Μερική επιστροφή:** Ακυρώστε μεταξύ **7 και 14 ημερών πριν από το check-in** για να λάβετε επιστροφή 50% της συνολικής αξίας κράτησης.

    **Χωρίς επιστροφή:** Οι ακυρώσεις που γίνονται **λιγότερο από 7 ημέρες πριν από το check-in** δεν επιστρέφονται. Χρεώνεται το πλήρες ποσό κράτησης.

    **Μη εμφάνιση:** Εάν δεν εμφανιστείτε την προγραμματισμένη ημερομηνία check-in χωρίς προηγούμενη ειδοποίηση, χρεώνεται το πλήρες ποσό κράτησης.

    **Έκτακτες περιστάσεις:** Σε περιπτώσεις τεκμηριωμένων ιατρικών εκτάκτων αναγκών ή κυβερνητικών ταξιδιωτικών περιορισμών, θα συνεργαστούμε μαζί σας για να βρούμε μια δίκαιη λύση, συμπεριλαμβανομένων αλλαγών ημερομηνιών ή πίστωσης για μελλοντική διαμονή.
