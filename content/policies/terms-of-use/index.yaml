content:
  en: |
    ## 1. Acceptance of Terms

    By accessing and using the Onar Syros website (the "Site") you accept and agree to be bound by these Terms of Use. If you do not agree to these terms, please do not use the Site.

    ## 2. Use of the Site

    The Site is provided for the purpose of presenting information about Onar Syros accommodation and facilitating enquiries and reservations. You may not use the Site for any unlawful purpose or in any way that could damage, disable, overburden or impair it.

    ## 3. Intellectual Property

    All content on the Site — including text, photographs, graphics, logos and design — is the property of Onar Syros or its content suppliers and is protected by applicable intellectual property laws. You may not reproduce, distribute or use any content without prior written permission.

    ## 4. Accuracy of Information

    We make every effort to ensure that the information on the Site is accurate and up to date. However, we cannot guarantee that all content is free of errors or omissions. Pricing, availability and property details are subject to change without notice. The confirmed details of your reservation, as set out in your booking confirmation email, take precedence over any information displayed on the Site.

    ## 5. External Links

    The Site may contain links to third-party websites. These links are provided for your convenience only; Onar Syros does not endorse and is not responsible for the content of any linked site.

    ## 6. Limitation of Liability

    To the fullest extent permitted by applicable law, Onar Syros shall not be liable for any indirect, incidental or consequential damages arising out of or in connection with your use of the Site.

    ## 7. Governing Law

    These Terms of Use are governed by Greek law. Any disputes arising in connection with them shall be subject to the exclusive jurisdiction of the courts of Syros, Greece.

    ## 8. Changes to These Terms

    We reserve the right to update these Terms at any time. Changes will be posted on this page with an updated date. Your continued use of the Site after any changes constitutes acceptance of the revised Terms.

    **Last updated: 1 June 2025**
