    ## 1. Αποδοχή Όρων

    Χρησιμοποιώντας τον ιστότοπο του Onar Syros (ο "Ιστότοπος") αποδέχεστε και συμφωνείτε να δεσμεύεστε από τους παρόντες Όρους Χρήσης. Αν δεν συμφωνείτε με αυτούς τους όρους, παρακαλούμε μην χρησιμοποιείτε τον Ιστότοπο.

    ## 2. Χρήση του Ιστότοπου

    Ο Ιστότοπος παρέχεται για τον σκοπό παρουσίασης πληροφοριών σχετικά με τα καταλύματα του Onar Syros και τη διευκόλυνση ερωτημάτων και κρατήσεων. Δεν επιτρέπεται η χρήση του Ιστότοπου για οποιονδήποτε παράνομο σκοπό.

    ## 3. Πνευματική Ιδιοκτησία

    Όλο το περιεχόμενο του Ιστότοπου — κείμενο, φωτογραφίες, γραφικά, λογότυπα και σχεδιασμός — ανήκει στο Onar Syros ή στους προμηθευτές περιεχομένου του και προστατεύεται από τους ισχύοντες νόμους πνευματικής ιδιοκτησίας.

    ## 4. Ακρίβεια Πληροφοριών

    Καταβάλλουμε κάθε προσπάθεια για να διασφαλίσουμε ότι οι πληροφορίες στον Ιστότοπο είναι ακριβείς. Ωστόσο, δεν μπορούμε να εγγυηθούμε ότι όλο το περιεχόμενο είναι απαλλαγμένο από σφάλματα. Τιμές, διαθεσιμότητα και λεπτομέρειες ακινήτων υπόκεινται σε αλλαγές χωρίς προειδοποίηση.

    ## 5. Εφαρμοστέο Δίκαιο

    Οι παρόντες Όροι Χρήσης διέπονται από το ελληνικό δίκαιο. Τυχόν διαφορές υπάγονται στην αποκλειστική αρμοδιότητα των δικαστηρίων Σύρου, Ελλάδα.

    **Τελευταία ενημέρωση: 1 Ιουνίου 2025**
