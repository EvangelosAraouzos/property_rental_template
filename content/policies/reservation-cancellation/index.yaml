content:
  en: |
    ## Making a Reservation

    Reservations can be made directly via email, phone, or through our authorised booking partners (Airbnb, Booking.com). A reservation is confirmed once you receive a written confirmation from us.

    Direct reservations may require a deposit of 30% of the total booking value at the time of confirmation. The remaining balance is due on arrival. We accept bank transfer and major credit/debit cards.

    ## Check-in & Check-out

    - **Check-in:** from 15:00. A self check-in key box is available at the entrance for flexible arrival.
    - **Check-out:** by 11:00.
    - **Early check-in / late check-out:** available on request, subject to availability, at no extra charge.
    - **Late arrivals (after 21:00):** please notify us in advance. We will make arrangements to ensure you can access your room at any hour.

    ## Cancellation Policy

    | Notice given before check-in | Refund |
    |---|---|
    | 14 days or more | Full refund of any deposit paid |
    | 7–13 days | 50% of total booking value |
    | Less than 7 days | No refund |

    Cancellations must be made in writing (email to stay@onarsyros.com). The cancellation date is the date we receive your written notification.

    **No-shows:** If you do not arrive on the scheduled check-in date without prior notice, the full booking amount is charged.

    **Early departures:** No refund is issued for unused nights if you choose to check out earlier than your confirmed departure date.

    ## Exceptional Circumstances

    In cases of documented medical emergencies, or government-imposed travel restrictions that make your travel impossible, we will work with you to find a fair solution — including date changes or a credit note valid for 12 months.

    ## Damage & Security Deposit

    Guests are responsible for any damage to the property, furniture or equipment during their stay. We may request a refundable security deposit of up to €150 for certain rooms, to be returned within 3 business days of check-out provided no damage is found.

    ## Minimum Stay

    A minimum stay of 2 nights applies. During peak season (July–August) a minimum of 3 nights may apply. Exceptions at our discretion.

    ## Contact

    For reservations and cancellations: **stay@onarsyros.com** or **+30 22810 00000**.
  el: |
    ## Πραγματοποίηση Κράτησης

    Οι κρατήσεις μπορούν να γίνουν απευθείας μέσω email, τηλεφώνου ή μέσω των εξουσιοδοτημένων συνεργατών μας (Airbnb, Booking.com). Μια κράτηση επιβεβαιώνεται μόλις λάβετε γραπτή επιβεβαίωση από εμάς.

    Οι άμεσες κρατήσεις ενδέχεται να απαιτούν προκαταβολή 30% της συνολικής αξίας κατά την επιβεβαίωση. Το υπόλοιπο καταβάλλεται κατά την άφιξη.

    ## Check-in & Check-out

    - **Check-in:** από 15:00. Κλειδαριά με κωδικό στην είσοδο για ευέλικτη άφιξη.
    - **Check-out:** έως 11:00.
    - **Πρώιμο check-in / καθυστερημένο check-out:** κατόπιν αιτήματος, ανάλογα με διαθεσιμότητα, χωρίς επιπλέον χρέωση.

    ## Πολιτική Ακύρωσης

    | Ειδοποίηση πριν από το check-in | Επιστροφή |
    |---|---|
    | 14 ημέρες ή περισσότερο | Πλήρης επιστροφή οποιασδήποτε προκαταβολής |
    | 7–13 ημέρες | 50% της συνολικής αξίας κράτησης |
    | Λιγότερο από 7 ημέρες | Καμία επιστροφή |

    Οι ακυρώσεις πρέπει να γίνονται γραπτώς (email στο stay@onarsyros.com).

    **Μη εμφάνιση:** Εάν δεν εμφανιστείτε κατά την προγραμματισμένη ημερομηνία check-in χωρίς προηγούμενη ειδοποίηση, χρεώνεται το πλήρες ποσό κράτησης.

    ## Έκτακτες Περιστάσεις

    Σε περιπτώσεις τεκμηριωμένων ιατρικών εκτάκτων αναγκών ή κυβερνητικών ταξιδιωτικών περιορισμών, θα συνεργαστούμε μαζί σας για να βρούμε μια δίκαιη λύση — συμπεριλαμβανομένων αλλαγών ημερομηνιών ή πιστωτικού σημειώματος.

    ## Ελάχιστη Διαμονή

    Ελάχιστη διαμονή 2 νύχτες. Κατά την υψηλή σεζόν (Ιούλιος–Αύγουστος) μπορεί να ισχύει ελάχιστο 3 νυκτών.

    ## Επικοινωνία

    Για κρατήσεις και ακυρώσεις: **stay@onarsyros.com** ή **+30 22810 00000**.
