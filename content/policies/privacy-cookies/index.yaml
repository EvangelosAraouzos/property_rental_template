content:
  en: |
    ## 1. Who We Are

    Onar Syros is a family-run accommodation business operating at Ermoupolis, Syros 84100, Greece. When we refer to "we", "our" or "us" in this policy, we mean Onar Syros. Our contact email is stay@onarsyros.com.

    ## 2. What Personal Data We Collect

    When you make an enquiry or reservation through the Site or by email/phone, we may collect:

    - **Contact details:** name, email address, phone number.
    - **Stay details:** arrival/departure dates, number of guests, special requests.
    - **Payment information:** processed securely by our payment provider; we do not store card numbers.
    - **Communication records:** emails and messages you send us.

    When you browse the Site, we may automatically collect:
    - IP address, browser type and referring URL (via server logs and analytics cookies).

    ## 3. How We Use Your Data

    We use your personal data to:
    - Process and manage your reservation.
    - Communicate with you about your stay.
    - Comply with our legal obligations (e.g. guest registration required by Greek law).
    - Improve the Site and our services (aggregated, anonymised analytics only).

    We do not sell or share your personal data with third parties for marketing purposes.

    ## 4. Legal Basis for Processing

    Under GDPR, our legal bases are:
    - **Contract performance** — processing your reservation and managing your stay.
    - **Legal obligation** — guest registration as required by Greek authorities.
    - **Legitimate interests** — improving our services and securing our systems.

    ## 5. Cookies

    We use the following types of cookies:

    | Type | Purpose | Duration |
    |---|---|---|
    | Essential | Site functionality (session, security) | Session |
    | Analytics | Aggregated usage statistics (no personal identification) | Up to 13 months |

    You can control cookies through your browser settings. Disabling analytics cookies will not affect your ability to use the Site.

    ## 6. Data Retention

    We retain guest records for 5 years to meet accounting and legal obligations under Greek law, after which they are securely deleted.

    ## 7. Your Rights

    Under GDPR you have the right to: access your data, correct inaccuracies, request deletion (subject to legal obligations), restrict processing, and lodge a complaint with the Hellenic Data Protection Authority (www.dpa.gr).

    To exercise any of these rights, contact us at stay@onarsyros.com.

    ## 8. Changes to This Policy

    We may update this policy from time to time. Changes will be posted on this page with an updated date.

    **Last updated: 1 June 2025**
  el: |
    ## 1. Ποιοι Είμαστε

    Το Onar Syros είναι οικογενειακή επιχείρηση φιλοξενίας που λειτουργεί στην Ερμούπολη, Σύρος 84100, Ελλάδα. Η διεύθυνση επικοινωνίας μας είναι stay@onarsyros.com.

    ## 2. Ποια Προσωπικά Δεδομένα Συλλέγουμε

    Κατά την υποβολή ερωτήματος ή κράτησης, ενδέχεται να συλλέξουμε:
    - **Στοιχεία επικοινωνίας:** όνομα, διεύθυνση email, τηλέφωνο.
    - **Στοιχεία διαμονής:** ημερομηνίες άφιξης/αναχώρησης, αριθμός επισκεπτών, ειδικές απαιτήσεις.
    - **Αρχεία επικοινωνίας:** emails και μηνύματα που μας στέλνετε.

    ## 3. Πώς Χρησιμοποιούμε τα Δεδομένα σας

    Χρησιμοποιούμε τα προσωπικά σας δεδομένα για:
    - Επεξεργασία και διαχείριση της κράτησής σας.
    - Επικοινωνία σχετικά με τη διαμονή σας.
    - Συμμόρφωση με τις νομικές μας υποχρεώσεις (π.χ. δήλωση επισκεπτών που απαιτεί ο ελληνικός νόμος).

    Δεν πωλούμε ούτε μοιραζόμαστε τα προσωπικά σας δεδομένα με τρίτους για σκοπούς μάρκετινγκ.

    ## 4. Cookies

    Χρησιμοποιούμε απαραίτητα cookies για τη λειτουργία του ιστότοπου και cookies ανάλυσης για συγκεντρωτικά στατιστικά χρήσης (χωρίς προσωπική αναγνώριση). Μπορείτε να ελέγξετε τα cookies μέσω των ρυθμίσεων του περιηγητή σας.

    ## 5. Τα Δικαιώματά σας

    Βάσει του GDPR έχετε δικαίωμα πρόσβασης, διόρθωσης, διαγραφής και περιορισμού επεξεργασίας των δεδομένων σας. Για να ασκήσετε οποιοδήποτε από αυτά τα δικαιώματα, επικοινωνήστε μαζί μας στο stay@onarsyros.com.

    **Τελευταία ενημέρωση: 1 Ιουνίου 2025**
