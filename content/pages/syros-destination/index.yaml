content:
  en: |
    ## Syros — The Cyclades' Best-Kept Secret

    Most visitors to the Greek islands follow the well-worn trail to Santorini, Mykonos or Paros. Those who find their way to Syros discover something rarer: a genuine, lived-in Greek city that happens to be beautiful — a place where locals outnumber tourists, the tavernas stay open all year and the architecture rivals anything you'll find in Naples or Marseille.

    Ermoupolis, the island's capital and the administrative centre of the entire Cyclades, is a UNESCO-listed city of neoclassical mansions, marble-paved squares and a waterfront that buzzes from early morning to late at night. It does not perform for tourists; it simply is itself, and that is the charm.

    ## Getting There

    **By ferry:** Syros is one of the best-connected islands in the Aegean. High-speed catamarans from Piraeus (Athens port) take as little as 2 hours 15 minutes; conventional overnight ferries are a relaxing 4–5 hours. Multiple sailings run daily in summer, with year-round service.

    **By air:** Syros National Airport (JSY) has daily domestic flights from Athens (ATH), flight time approximately 40 minutes. A taxi from the airport to Ermoupolis takes 10–15 minutes.

    ## What to See & Do

    ### In Ermoupolis
    - **Miaouli Square** — the grand neoclassical centrepiece of the city, lined with marble and flanked by the imposing Town Hall
    - **Vaporia district** — clifftop 19th-century mansions with sea-bathing steps cut directly into the rock; arguably the most beautiful neighbourhood in all of the Cyclades
    - **Apollo Theatre** — one of the oldest opera houses in Greece, a miniature La Scala that still hosts performances
    - **Industrial Museum of Ermoupolis** — tells the story of how Syros was the industrial powerhouse of 19th-century Greece
    - **Ano Syros** — the medieval Catholic hilltop settlement, 1.2 km from the port, with winding lanes, a cathedral and sweeping views

    ### Beaches
    - **Asteria** — a small city beach under a kilometre from the port; a great option if you just want a quick swim
    - **Galissas** — the most popular sandy beach on the island, about 8 km from Ermoupolis; calm, tree-fringed, with tavernas and sunbeds
    - **Kini** — a quiet, picturesque fishing village with a sandy bay, 7 km out; wonderful for sunset dinners by the water
    - **Azolimnos** — a hidden gem on the east coast, shallow and calm, perfect for families

    ### Food & Drink
    Syros has its own culinary identity. Look out for **loukoumades** (honey-drenched doughnuts), the island's famous **loukoumi** (Greek delight — the Syros version is considered the finest in Greece), **halva** and exceptional fresh seafood. The covered **market hall** near the port is the best place to explore local produce in the morning.

    ## Practical Tips

    - **Getting around:** Ermoupolis is compact and walkable. For the rest of the island, rent a car, scooter or ATV from one of the agencies near the port — rates are reasonable and the roads are good.
    - **Best time to visit:** May–June and September–October offer warm weather, calm seas and far fewer crowds than July–August. The island is also surprisingly enjoyable in winter, when it feels genuinely local.
    - **Language:** Greek is the first language everywhere, but English is widely spoken, especially among younger locals and in tourism-facing businesses.
  el: |
    ## Σύρος — Το Καλύτερα Κρυμμένο Μυστικό των Κυκλάδων

    Οι περισσότεροι επισκέπτες των ελληνικών νησιών ακολουθούν τη γνωστή διαδρομή προς Σαντορίνη, Μύκονο ή Πάρο. Αυτοί που βρίσκουν τον δρόμο τους στη Σύρο ανακαλύπτουν κάτι πιο σπάνιο: μια αληθινή, ζωντανή ελληνική πόλη που τυγχάνει να είναι όμορφη.

    Η Ερμούπολη, πρωτεύουσα του νησιού και διοικητικό κέντρο ολόκληρων των Κυκλάδων, είναι μια πόλη καταχωρημένη στην UNESCO με νεοκλασικά αρχοντικά, μαρμάρινες πλατείες και προκυμαία που ζωντανεύει από νωρίς το πρωί ως αργά το βράδυ.

    ## Πώς να Φτάσετε

    **Με πλοίο:** Η Σύρος είναι ένα από τα πιο συνδεδεμένα νησιά του Αιγαίου. Τα υδροπτέρυγα από τον Πειραιά φτάνουν σε λιγότερο από 2 ώρες και 15 λεπτά· τα συμβατικά νυκτερινά πλοία σε 4–5 ώρες.

    **Με αεροπλάνο:** Το Εθνικό Αεροδρόμιο Σύρου (JSY) έχει καθημερινές εσωτερικές πτήσεις από Αθήνα (ATH), χρόνος πτήσης περίπου 40 λεπτά.

    ## Τι να Δείτε & να Κάνετε

    ### Στην Ερμούπολη
    - **Πλατεία Μιαούλη** — το μεγαλοπρεπές νεοκλασικό κέντρο της πόλης, με μάρμαρο και το επιβλητικό Δημαρχείο
    - **Βαπόρια** — αρχοντικά του 19ου αιώνα σε βραχώδη ακτή με σκαλιά κατευθείαν στη θάλασσα
    - **Θέατρο Απόλλων** — ένα από τα παλαιότερα λυρικά θέατρα στην Ελλάδα
    - **Άνω Σύρος** — ο μεσαιωνικός Καθολικός λόφος, 1,2 χλμ από το λιμάνι

    ### Παραλίες
    - **Αστερία** — μικρή παραλία κοντά στο λιμάνι
    - **Γαλησσάς** — η πιο δημοφιλής αμμώδης παραλία, περίπου 8 χλμ
    - **Κίνι** — ήσυχο ψαροχώρι με αμμώδη κόλπο, 7 χλμ

    ## Πρακτικές Συμβουλές

    - **Μετακίνηση:** Η Ερμούπολη είναι συμπαγής και κατάλληλη για περπάτημα. Για το υπόλοιπο νησί νοικιάστε αυτοκίνητο, σκούτερ ή ATV.
    - **Καλύτερη εποχή:** Μάιος–Ιούνιος και Σεπτέμβριος–Οκτώβριος προσφέρουν ζεστό καιρό, ήρεμες θάλασσες και πολύ λιγότερα πλήθη από τον Ιούλιο–Αύγουστο.
