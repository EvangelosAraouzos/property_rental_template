title:
  en: "Getting Here"
  el: "Πώς να Φτάσετε"

seoDescription:
  en: "How to reach Onar Syros in Ermoupolis, Syros — by ferry from Piraeus or by plane to Syros National Airport, plus what to see and do nearby."
  el: "Πώς να φτάσετε στο Οναρ Σύρος στην Ερμούπολη Σύρου — με πλοίο από τον Πειραιά ή αεροπλάνο στο Εθνικό Αεροδρόμιο Σύρου."

content:
  en: |
    ## By Ferry

    Syros is exceptionally well connected. The fastest ferries from Piraeus (Athens port) take as little as **2 hours 15 minutes** on the high-speed catamarans, or around 4–5 hours on the conventional overnight ferries. Multiple sailings operate daily in summer.

    From the ferry terminal in Ermoupolis our buildings are a short walk or a quick taxi ride away.

    **Useful ferry operators:**
    - Hellenic Seaways
    - SeaJets
    - Golden Star Ferries

    ## By Air

    Syros National Airport (JSY) receives domestic flights year-round, with frequent connections to Athens International Airport (ATH). Flight time is approximately 40 minutes.

    A taxi from the airport to Ermoupolis takes about 10–15 minutes.

    ## Getting Around Syros

    Ermoupolis itself is a compact, walkable city — both Onar A and Onar B are within easy walking distance of the harbour, the main square, restaurants, cafés and beaches. For exploring the rest of the island, car and motorbike rentals are available close to the port.

    ## Nearby

    - **Miaoulis Square** — the grand neoclassical heart of Ermoupolis, 5 min walk
    - **Vaporia sea steps** — for swimming off the rocks, steps from Onar A
    - **Ermoupolis Market Hall** — fresh produce, local cheese and loukoumades, 8 min walk
    - **Ano Syros** — the medieval Catholic hilltop village, 20 min by foot or 5 min by taxi
    - **Galissas & Kini beaches** — 15–20 min by car or scooter
  el: |
    ## Με Πλοίο

    Η Σύρος είναι εξαιρετικά καλά συνδεδεμένη. Τα ταχύτερα πλοία από τον Πειραιά (λιμάνι Αθήνας) χρειάζονται μόλις **2 ώρες και 15 λεπτά** με τα υδροπτέρυγα, ή περίπου 4–5 ώρες με τα συμβατικά νυκτερινά πλοία. Πολλαπλά δρομολόγια λειτουργούν καθημερινά το καλοκαίρι.

    Από το λιμάνι της Ερμούπολης τα κτήριά μας απέχουν μια σύντομη βόλτα ή ένα γρήγορο ταξί.

    ## Με Αεροπλάνο

    Το Εθνικό Αεροδρόμιο Σύρου (JSY) δέχεται εσωτερικές πτήσεις καθ' όλη τη διάρκεια του χρόνου, με συχνές συνδέσεις από το Διεθνές Αεροδρόμιο Αθηνών (ATH). Ο χρόνος πτήσης είναι περίπου 40 λεπτά.

    Ταξί από το αεροδρόμιο στην Ερμούπολη: περίπου 10–15 λεπτά.

    ## Κοντά στο Οναρ Σύρος

    - **Πλατεία Μιαούλη** — η μεγαλοπρεπής νεοκλασική καρδιά της Ερμούπολης, 5 λεπτά με τα πόδια
    - **Θαλάσσια σκαλιά Βαπόρια** — για κολύμπι στα βράχια, βήματα από το Οναρ Α
    - **Στοά Ερμούπολης** — φρέσκα προϊόντα, τοπικά τυριά και λουκουμάδες, 8 λεπτά με τα πόδια
    - **Άνω Σύρος** — το μεσαιωνικό καθολικό χωριό, 20 λεπτά με τα πόδια ή 5 λεπτά με ταξί
    - **Παραλίες Γαλησσά & Κίνι** — 15–20 λεπτά με αυτοκίνητο ή σκούτερ
