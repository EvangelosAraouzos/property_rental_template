content:
  en: |
    ## Our Story

    Onar Syros grew from a simple, unhurried love for Ermoupolis — a city that manages to be both grandly neoclassical and genuinely Greek, where the smell of freshly ground coffee mingles with salt air and the sound of a distant church bell drifts through open shutters.

    Our family has called Syros home for generations. We grew up running through the marble lanes of the old town, swimming off its sea-washed steps and watching freighters move silently through the Aegean from our windows. When we had the chance to restore two of the neighbourhood's historic buildings, it felt less like a business decision and more like a responsibility — a way of preserving something beautiful and sharing it with people who love to travel well.

    ## Two Buildings, One Spirit

    **Onar Luxuries** occupies a 19th-century building in the neoclassical heart of Ermoupolis, less than 350 m from the port. Three carefully appointed studios and suites are furnished with handmade pieces in the white-and-blue palette of the Cyclades. Every morning a handpicked breakfast basket — local honey, Syros loukoumi, fresh bread — arrives at your door.

    **Onar Rustic Rooms** is a short walk further into the city, 650 m from the port, with twelve rooms and studios spread across three floors. It draws guests who value a great location and honest, unpretentious comfort — and the public car park right outside makes it a natural choice for visitors arriving by car.

    ## How We Host

    We are not a hotel chain. There is no impersonal front desk, no branded slippers in a sealed plastic bag. One of the family, or someone we trust completely, will meet you, show you around, and make sure you feel at home. We will point you to the bakery that opens at six for fresh tiropita, the quiet beach that the guidebooks haven't found yet, and the taverna where the owner's grandmother still makes the recipes.

    We want you to feel, even just for a few days, that Syros is yours.
  el: |
    ## Η Ιστορία μας

    Το Onar Syros γεννήθηκε από μια απλή, ανεπίστροφη αγάπη για την Ερμούπολη — μια πόλη που καταφέρνει να είναι ταυτόχρονα μεγαλοπρεπώς νεοκλασική και αληθινά ελληνική, όπου η μυρωδιά του φρεσκοαλεσμένου καφέ αναμειγνύεται με θαλασσινό αέρα.

    Η οικογένειά μας κατοικεί στη Σύρο εδώ και γενιές. Μεγαλώσαμε τρέχοντας στα μαρμάρινα στενά της παλιάς πόλης, κολυμπώντας στα θαλασσόπλυτα σκαλιά της και παρακολουθώντας φορτηγά πλοία να κινούνται αθόρυβα μέσα από το Αιγαίο από τα παράθυρά μας.

    ## Δύο Κτήρια, Ένα Πνεύμα

    Το **Onar Luxuries** καταλαμβάνει ένα κτήριο του 19ου αιώνα στη νεοκλασική καρδιά της Ερμούπολης, λιγότερο από 350μ από το λιμάνι. Τρία προσεκτικά διαμορφωμένα στούντιο και σουίτες είναι επιπλωμένα με χειροποίητα κομμάτια. Κάθε πρωί ένα επιλεγμένο καλάθι πρωινού φτάνει στην πόρτα σας.

    Το **Onar Rustic Rooms** βρίσκεται λίγο πιο μέσα στην πόλη, 650μ από το λιμάνι, με δώδεκα δωμάτια και στούντιο σε τρεις ορόφους.

    ## Πώς Φιλοξενούμε

    Δεν είμαστε αλυσίδα ξενοδοχείων. Ένα μέλος της οικογένειάς μας, ή κάποιος στον οποίο εμπιστευόμαστε απόλυτα, θα σας υποδεχθεί, θα σας ξεναγήσει και θα βεβαιωθεί ότι νιώθετε σαν στο σπίτι σας.
