slug: about

title:
  en: "About Onar Syros"
  el: "Σχετικά με το Οναρ Σύρος"

seoDescription:
  en: "Learn the story behind Onar Syros — a family-run boutique accommodation in the historic Vaporia district and city centre of Ermoupolis, Syros, Greece."
  el: "Μάθετε την ιστορία πίσω από το Οναρ Σύρος — ένα οικογενειακό μπουτίκ κατάλυμα στη Βαπόρια και στο κέντρο της Ερμούπολης, Σύρος."

content:
  en: |
    ## Our Story

    Onar Syros was born from a deep, unhurried love for Ermoupolis — a city that manages to be both grandly neoclassical and genuinely Greek, a place where the smell of freshly ground coffee mingles with salt air and the sound of a distant church bell.

    Our family has called Syros home for generations. We grew up running through the marble lanes of the Vaporia district, swimming off its sea-washed steps, watching freighters move through the Aegean from our windows. When we had the chance to restore two of the neighbourhood's historic buildings, it felt less like a business decision and more like a responsibility.

    ## The Buildings

    **Onar A** stands in the Vaporia district, the elegant 19th-century clifftop neighbourhood where Syros's prosperous merchant families once lived. The building dates to the 1870s and was painstakingly restored over two years, with original plaster mouldings, flagstone floors and the distinctive terracotta roof tiles carefully preserved.

    **Onar B** sits closer to the city's beating heart — a short walk from the neoclassical Miaoulis Square, the covered market and the main harbour. It wraps around a quiet inner courtyard that feels like a secret the rest of Ermoupolis doesn't know about.

    ## How We Host

    We are not a hotel chain. There is no front desk, no impersonal check-in process. One of the family will meet you, show you around, point out the best bakery for a cheese pie at seven in the morning and the taverna where you should book for Friday night. We will remember your name, your coffee preference, and whether you like the shutters open or closed.

    We want you to feel, even just for a few days, that Syros is yours.
  el: |
    ## Η Ιστορία μας

    Το Οναρ Σύρος γεννήθηκε από μια βαθιά, ανεπίστροφη αγάπη για την Ερμούπολη — μια πόλη που καταφέρνει να είναι ταυτόχρονα μεγαλοπρεπώς νεοκλασική και αληθινά ελληνική.

    Η οικογένειά μας κατοικεί στη Σύρο εδώ και γενιές. Μεγαλώσαμε τρέχοντας στα μαρμάρινα στενά της Βαπόρια, κολυμπώντας στα θαλασσόπλυτα σκαλιά της, παρακολουθώντας φορτηγά πλοία να διασχίζουν το Αιγαίο από τα παράθυρά μας. Όταν είχαμε την ευκαιρία να αποκαταστήσουμε δύο από τα ιστορικά κτήρια της περιοχής, ένιωσε λιγότερο σαν επιχειρηματική απόφαση και περισσότερο σαν ευθύνη.

    ## Τα Κτήρια

    Το **Οναρ Α** βρίσκεται στη Βαπόρια, την κομψή συνοικία του 19ου αιώνα στη βραχώδη ακτή όπου ζούσαν κάποτε οι εύποροι έμποροι της Σύρου. Το κτήριο χρονολογείται από τη δεκαετία του 1870 και αποκαταστάθηκε με επιμέλεια σε διάστημα δύο χρόνων.

    Το **Οναρ Β** βρίσκεται πιο κοντά στην καρδιά της πόλης — μια σύντομη βόλτα από την νεοκλασική Πλατεία Μιαούλη, τη στοά και το κεντρικό λιμάνι.

    ## Πώς Φιλοξενούμε

    Δεν είμαστε αλυσίδα ξενοδοχείων. Δεν υπάρχει ρεσεψιόν, δεν υπάρχει απρόσωπη διαδικασία check-in. Ένας από την οικογένεια θα σας υποδεχθεί, θα σας ξεναγήσει, θα σας δείξει τον καλύτερο φούρνο για τυρόπιτα και την ταβέρνα που πρέπει να κλείσετε τραπέζι την Παρασκευή το βράδυ.
