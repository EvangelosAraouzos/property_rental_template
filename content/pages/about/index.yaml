seoDescription:
  en: "Learn the story behind Onar Syros — a family-run boutique accommodation in the heart of Ermoupolis, Syros, Greece, across two lovingly restored buildings."
  el: "Μάθετε την ιστορία πίσω από το Onar Syros — ένα οικογενειακό μπουτίκ κατάλυμα στην καρδιά της Ερμούπολης Σύρου, σε δύο με αγάπη αποκατεστημένα κτήρια."

