shortDescription:
  en: "A split-level maisonette that makes the most of Ermoupolis's wonderful layered architecture. The sleeping loft is reached by a traditional wooden staircase, creating a genuinely magical island-home feeling. On the ground level a living-dining area opens onto the courtyard, and a well-equipped kitchen means longer stays are a pleasure. Comfortably sleeps three adults or a small family."
  el: "Μια διώροφη μεζονέτα που εκμεταλλεύεται στο έπακρο τη θαυμάσια πολυεπίπεδη αρχιτεκτονική της Ερμούπολης. Το ανώγι ύπνου φθάνεται με παραδοσιακή ξύλινη σκάλα, δημιουργώντας μια πραγματικά μαγευτική αίσθηση νησιώτικου σπιτιού. Στο ισόγειο, ο χώρος καθιστικού-τραπεζαρίας ανοίγει στην αυλή."

