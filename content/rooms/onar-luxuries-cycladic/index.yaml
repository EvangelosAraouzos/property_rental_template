  en: "The Cycladic studio is a light-filled ground-floor space fitted throughout with handmade furniture in the classic white-and-blue palette of the Cyclades. A fully equipped kitchenette, espresso machine and every home comfort ensure a relaxed, self-sufficient stay in the heart of Ermoupolis."
  el: "Το Κυκλαδίτικο στούντιο είναι ένας φωτεινός χώρος ισογείου με χειροποίητα έπιπλα στην κλασική λευκή-και-μπλε παλέτα των Κυκλάδων. Πλήρως εξοπλισμένη κουζίνα, μηχανή espresso και κάθε άνεση σπιτιού."
