  en: "A lovingly maintained Cycladic building wrapped around a peaceful inner courtyard, just minutes from Miaoulis Square and the main harbour. Onar B blends the island's signature whitewash simplicity with contemporary comfort — ideal for those who want Syros's vibrant city life at their doorstep and tranquillity just inside."
  el: "Ένα με αγάπη διατηρημένο κυκλαδίτικο κτήριο γύρω από μια ήσυχη εσωτερική αυλή, μόλις λίγα λεπτά από την Πλατεία Μιαούλη και το κεντρικό λιμάνι. Το Οναρ Β συνδυάζει την καθαρότητα της ασβεστωμένης λευκής απλότητας του νησιού με σύγχρονη άνεση."

