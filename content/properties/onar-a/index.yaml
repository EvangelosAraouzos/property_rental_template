shortDescription:
  en: "A beautifully restored 19th-century neoclassical building perched above the Aegean in Ermoupolis's celebrated Vaporia district. Three light-filled sea-facing apartments where whitewashed walls, terracotta tiles and uninterrupted sea views set the mood from the moment you arrive."
  el: "Ένα όμορφα αποκατεστημένο νεοκλασικό κτήριο του 19ου αιώνα που δεσπόζει πάνω από το Αιγαίο στη φημισμένη συνοικία Βαπόρια της Ερμούπολης. Τρία φωτεινά διαμερίσματα με θέα στη θάλασσα όπου ασβεστωμένοι τοίχοι, πλακάκια τερακότα και αδιάκοπη θέα στη θάλασσα δίνουν τον τόνο από τη στιγμή που φτάνετε."

